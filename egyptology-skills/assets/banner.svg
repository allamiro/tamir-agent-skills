<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Egyptology Skills</title>
  <desc id="d">Eight agent skills for hieroglyph sign lookup, transliteration, text annotation, app building, accuracy review, literature, editorial conventions and provenance. Eight colored tiles stand for the skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2410"/>
      <stop offset="1" stop-color="#7a4a17"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3b3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#096efb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#096efb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <circle cx="930" cy="40" r="240" fill="url(#glowA)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="68" font-weight="800" fill="url(#word)" letter-spacing="-1.2">Egyptology Skills</text>
    <rect x="66" y="154" width="120" height="6" rx="3" fill="#f5eb89"/>
    <text x="64" y="208" font-size="26" fill="#ffeccc">Read, annotate and check hieroglyphic text, with the doubt shown</text>
    <text x="64" y="244" font-size="20" font-weight="600" fill="#f5c97a">8 skills  ·  86 checked signs  ·  draft output for experts</text>
  </g>
  <g>
    <rect x="800"  y="58" width="56" height="56" rx="12" fill="#096efb"/>
    <rect x="868"  y="58" width="56" height="56" rx="12" fill="#9cc464"/>
    <rect x="936"  y="58" width="56" height="56" rx="12" fill="#f5eb89"/>
    <rect x="1004"  y="58" width="56" height="56" rx="12" fill="#fb6373"/>
    <rect x="800"  y="126" width="56" height="56" rx="12" fill="#6c64eb"/>
    <rect x="868"  y="126" width="56" height="56" rx="12" fill="#096efb"/>
    <rect x="936"  y="126" width="56" height="56" rx="12" fill="#9cc464"/>
    <rect x="1004"  y="126" width="56" height="56" rx="12" fill="#f5eb89"/>
