  <title id="t">Agent Skills</title>
  <desc id="d">Reusable expert workflows for Claude Code, Codex and ChatGPT. A grid of 51 colored tiles stands for the 51 skills in three collections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15123d"/>
